<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Todo List{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body {
                min-height: 100vh;
                background-color: #f8f9fa;
            }
            .sidebar {
                min-height: 100vh;
                background-color: #212529;
                color: white;
            }
            .sidebar a {
                color: #dee2e6;
                text-decoration: none;
            }
            .sidebar a:hover {
                color: white;
            }
            .content {
                padding: 2rem;
            }
            .mobile-nav {
                display: none;
            }

            @media (max-width: 767.98px) {
                .sidebar {
                    display: none !important;
                }
                .content {
                    padding: 1rem 1rem 5.5rem;
                }
                .mobile-nav {
                    display: flex;
                    justify-content: space-around;
                    align-items: center;
                    position: fixed;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    background-color: #212529;
                    padding: 0.75rem 0.5rem;
                    z-index: 1000;
                }
                .mobile-nav a {
                    color: #dee2e6;
                    text-decoration: none;
                    font-size: 1.1rem;
                }
                .mobile-nav a:hover {
                    color: white;
                }
            }
        </style>
    </head>
    <body>
        <div class="container-fluid">
            <div class="row">
                <nav class="col-md-3 col-lg-2 d-flex flex-column p-3 sidebar">
                    <h4 class="mb-4">Todo List</h4>
                    <ul class="nav nav-pills flex-column">
                        <li class="nav-item mb-2">
                            <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link" href="{{ url_for('new_task') }}">New task</a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link" href="{{ url_for('recurring_tasks') }}">Recurring tasks</a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link" href="{{ url_for('profile') }}">Profile</a>
                        </li>
                    </ul>
                </nav>

                <nav class="mobile-nav" aria-label="Mobile navigation">
                    <a href="{{ url_for('index') }}" title="Home">🏠</a>
                    <a href="{{ url_for('new_task') }}" title="New task">➕</a>
                    <a href="{{ url_for('recurring_tasks') }}" title="Recurring tasks">🔁</a>
                    <a href="{{ url_for('profile') }}" title="Profile">👤</a>
                </nav>

                <main class="col-md-9 col-lg-10 content">
                    {% block content %}{% endblock %}
                </main>
            </div>
        </div>

        {% block scripts %}{% endblock %}
    </body>
</html>
