<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Todo List{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body {
                min-height: 100vh;
                background-color: #f8f9fa;
            }
            .sidebar {
                min-height: 100vh;
                background-color: #212529;
                color: white;
            }
            .sidebar a {
                color: #dee2e6;
                text-decoration: none;
            }
            .sidebar a:hover {
                color: white;
            }
            .content {
                padding: 2rem;
            }
        </style>
    </head>
    <body>
        <div class="container-fluid">
            <div class="row">
                <nav class="col-md-3 col-lg-2 d-flex flex-column p-3 sidebar">
                    <h4 class="mb-4">Todo List</h4>
                    <ul class="nav nav-pills flex-column">
                        <li class="nav-item mb-2">
                            <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link" href="{{ url_for('new_task') }}">New task</a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link" href="{{ url_for('timeline') }}">Timeline</a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link" href="{{ url_for('recurring_tasks') }}">Recurring tasks</a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link" href="{{ url_for('profile') }}">Profile</a>
                        </li>
                    </ul>
                </nav>

                <main class="col-md-9 col-lg-10 content">
                    {% block content %}{% endblock %}
                </main>
            </div>
        </div>
    </body>
</html>
