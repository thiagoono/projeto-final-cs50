{% extends "login_layout.html" %}

{% block title %}Log in{% endblock %}

{% block form_title %}Sign In{% endblock %}

{% block form_content %}
<form action="{{ url_for('login') }}" method="post" class="needs-validation" novalidate>
    <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input class="form-control" id="username" name="username" type="text" autocomplete="username" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Log In</button>
</form>

<p class="text-center mt-3 mb-0">
    New here? <a href="{{ url_for('register') }}">Create an account</a>
</p>
{% endblock %}
