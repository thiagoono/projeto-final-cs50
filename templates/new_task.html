{% extends "layout.html" %}

{% block title %}New task{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="mb-1">Create a new task</h2>
                        <p class="text-muted mb-0">Add a task with a title, description, and date/time.</p>
                    </div>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
                </div>

                <form id="task-form" action="/new-task" method="post">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" name="title" placeholder="What needs to be done?" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4" placeholder="Add some details"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="start_time" class="form-label">Start time</label>
                        <input type="datetime-local" class="form-control" id="start_time" name="start_time" required>
                    </div>

                    <div class="mb-4">
                        <label for="end_time" class="form-label">End time</label>
                        <input type="datetime-local" class="form-control" id="end_time" name="end_time" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Create task</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
