{% extends "layout.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-1">Today's tasks</h2>
        <p class="text-muted mb-0">Here you can keep track of what you need to do today.</p>
    </div>
    <a href="{{ url_for('new_task') }}" class="btn btn-primary">New task</a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <h5 class="card-title">Timeline</h5>
        <div class="mt-4">
            <div class="border-start border-3 ps-3 mb-3">
                <h6 class="mb-1">09:00</h6>
                <p class="mb-0">Study for class</p>
            </div>
            <div class="border-start border-3 ps-3 mb-3">
                <h6 class="mb-1">12:30</h6>
                <p class="mb-0">Lunch</p>
            </div>
            <div class="border-start border-3 ps-3 mb-3">
                <h6 class="mb-1">14:00</h6>
                <p class="mb-0">Work on the project</p>
            </div>
            <div class="border-start border-3 ps-3 mb-0">
                <h6 class="mb-1">20:00</h6>
                <p class="mb-0">Relax and review the day</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
