{% extends "layout.html" %}

{% block title %}Início{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-1">Tarefas do dia</h2>
        <p class="text-muted mb-0">Aqui você acompanha o que precisa fazer hoje.</p>
    </div>
    <a href="{{ url_for('new_task') }}" class="btn btn-primary">Nova tarefa</a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <h5 class="card-title">Linha do tempo</h5>
        <div class="mt-4">
            <div class="border-start border-3 ps-3 mb-3">
                <h6 class="mb-1">09:00</h6>
                <p class="mb-0">Estudar para a aula</p>
            </div>
            <div class="border-start border-3 ps-3 mb-3">
                <h6 class="mb-1">12:30</h6>
                <p class="mb-0">Almoçar</p>
            </div>
            <div class="border-start border-3 ps-3 mb-3">
                <h6 class="mb-1">14:00</h6>
                <p class="mb-0">Trabalhar no projeto</p>
            </div>
            <div class="border-start border-3 ps-3 mb-0">
                <h6 class="mb-1">20:00</h6>
                <p class="mb-0">Relaxar e revisar o dia</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
